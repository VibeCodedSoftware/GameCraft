<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon.png" />
    <title>Game</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      #overlay { position: absolute; inset: 0; pointer-events: none; }
      /* The HUD layer lets clicks through to the game; its buttons and screens take their own (styles.css). */
      #overlay > :not(.gc-hud) { pointer-events: auto; }
      #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at center, #26232c, #0c0b0f); color: #eee; font-family: "Segoe UI", system-ui, sans-serif; cursor: pointer; z-index: 50; text-align: center; padding: 16px; }
      #start h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); }
      #start p { margin: 0; color: #aaa; }
      #start .err { color: #ff8a8a; max-width: 640px; }
      /* Halfway down the right edge: the corners are where game HUDs put their text. */
      #net { position: fixed; top: 50%; right: 6px; transform: translateY(-50%); z-index: 40; background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 4px 8px; cursor: pointer; font: 12px system-ui; display: none; opacity: .55; }
      #net:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game"><div id="overlay"></div></div>
    <div id="start"><h1 id="title">Loading…</h1><p id="sub"></p></div>
    <button id="net" title="Online multiplayer">Multiplayer</button>
    <div id="modal-root"></div>
    <script>
      // Opened straight from a folder, a browser refuses to run the game's code and files, so it would sit on "Loading" for ever.
      if (location.protocol === 'file:') {
        document.getElementById('title').textContent = 'This game can\'t start from a folder';
        document.getElementById('sub').innerHTML = '<span class="err">Browsers don\'t let a page opened from your files load the rest of the game.<br>'
          + 'To play on this computer, export for <b>Windows</b> in GameCraft and open the .exe.<br>'
          + 'A <b>Web</b> export runs once it is on a website or web server.<br>'
          + 'An <b>Android</b> export is for building the app: see the instructions in its folder.</span>';
      }
    </script>
    <script type="module" src="/src/player/main.tsx"></script>
  </body>
</html>
